version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: foodreels-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodreels
      POSTGRES_USER: foodreels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodreels123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodreels"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: foodreels-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: foodreels-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://foodreels:${POSTGRES_PASSWORD:-foodreels123}@postgres:5432/foodreels
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web Frontend
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    container_name: foodreels-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${API_URL:-http://localhost:3000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - api

  # Nginx Reverse Proxy (optional for production)
  nginx:
    image: nginx:alpine
    container_name: foodreels-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    profiles:
      - production

volumes:
  postgres_data:
  redis_data: